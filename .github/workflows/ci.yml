name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 13:47 UTC: catches dependency or environment breakage in weeks
    # with no commits.
    - cron: "47 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npx react-scripts test --watchAll=false --ci
        env:
          CI: true

      - name: Build
        # CRA turns lint warnings into build errors when CI=true. The current
        # code has known warnings (tracked in an issue), so they are reported
        # here without failing the build. Remove this override once fixed.
        run: npm run build
        env:
          CI: false

      - name: Report bundle size
        if: success()
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh build build/static/js build/static/css build/static/media 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly CI check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "ci", per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            const body = `The scheduled CI run failed: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["ci"] });
            }
